name: Publish to npm

# Publishes mq-timeline-calendar when a `vX.Y.Z` tag is pushed. Run it by hand
# (Actions → Publish to npm → Run workflow) to publish a tag that existed
# before this workflow, e.g. v0.7.0.
#
# Authenticates with npm Trusted Publishing (OIDC): the package's npm
# settings trust this repository's publish.yml, so no token is stored here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.7.0)'
        required: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Skip if already published
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "mq-timeline-calendar@$VERSION" version >/dev/null 2>&1; then
            echo "mq-timeline-calendar@$VERSION is already on npm — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.published.outputs.skip != 'true'

      # `build` runs tsc before vite, so a type error fails the release.
      - run: npm run build
        if: steps.published.outputs.skip != 'true'

      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
